name: AeroFS
description: >-
  AeroFS was an enterprise file sync-and-share and secure collaboration product built by Air
  Computing Inc., founded in 2010 out of Y Combinator with seed backing from Andreessen Horowitz
  (a16z Seed), SV Angel, Avalon Ventures, and angels including Chris Sacca, Maynard Webb, Jerry
  Yang, and Paul Buchheit. Its differentiator was peer-to-peer, private-cloud file sync that kept
  data on a company's own devices rather than a vendor's servers. Air Computing later pivoted to a
  team collaboration app called Amium. In 2017 the company merged with Redbooth (CEO and co-founder
  Yuri Sagalov became CEO of Redbooth), Amium was shut down on December 15, 2017, and the AeroFS
  technology was folded into Redbooth's product line. The standalone AeroFS product, developer
  program, and API are no longer operated; the aerofs.com domain is now a parked GoDaddy "for sale"
  page. This API Evangelist profile is retained as a historical/defunct-company record rather than
  an active developer surface.
